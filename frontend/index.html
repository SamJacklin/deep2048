<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply the theme before first paint to prevent a flash.
      // Source of truth order matches ThemeProvider: shared cookie, then a
      // legacy localStorage value, then the device color-scheme preference.
      try {
        var m = document.cookie.match(/(?:^|;\s*)theme=(dark|light)/);
        var t = m ? m[1] : localStorage.getItem('theme');
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.classList.toggle('dark', t === 'dark');
      } catch (_) {
        document.documentElement.classList.add('dark');
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deep 2048 — DQN Agent Visualiser</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
