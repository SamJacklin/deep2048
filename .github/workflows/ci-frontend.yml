name: Frontend CI

on:
  pull_request:
    paths: [frontend/**]

concurrency:
  group: ci-frontend-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        env:
          NODE_ENV: production
        run: npm run build
        working-directory: frontend
